; Baseline PHP configuration for the Logistics ERP containers.
;
; Dropped in as a conf.d file rather than replacing php.ini so the extensions
; enabled by docker-php-ext-install (which live in their own conf.d files) keep
; working. The production image mounts zz-logistics-prod.ini on top of this one;
; conf.d is read alphabetically, so that file wins on any overlapping key.

[PHP]
; PHP 8.3/8.4 logs deprecations to stderr by default, which floods the container
; logs with notices that are already covered by the test suite. Errors and
; warnings still go to stderr, and everything still reaches Laravel's channel.
display_errors = Off
log_errors = On

; Bills of lading, customs scans and Excel exports are generated in-process, and
; a 200-row spreadsheet through PhpSpreadsheet will exceed the 128M default
; before it exceeds the 120 second default.
memory_limit = 512M
max_execution_time = 120

; Bill of lading and customs document uploads. Must stay in step: post_max_size
; is the hard ceiling and a mismatch is rejected with an empty $_POST, which
; surfaces as a validation error on a field that was never even sent.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; A stateless token API: no error pages that leak file paths, no UTC ambiguity
; in the log timestamps next to the ISO-8601 dates the API emits.
expose_php = Off
date.timezone = UTC

; Laravel resolves hundreds of autoload paths per request against a bind
; mounted tree; the default 16K entry / 120 second cache turns that into a
; stat storm on Windows and macOS hosts.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Session]
; Sanctum is used for bearer tokens, so the session cookie is only ever seen by
; the SPA auth bootstrap route. Still, make it unreadable from script and
; unusable from a cross-site form.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.sid_length = 48

[opcache]
; opcache is pointless with the CLI SAPI, where the queue worker, the scheduler
; and every artisan command run one-shot, so it is left off for CLI below.
opcache.enable = 1
opcache.enable_cli = 0

; The bind mount is the source of truth in development, so a saved file has to
; be visible immediately. The production overlay sets validate_timestamps = 0,
; which is the opposite trade and the reason it is a separate file.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
opcache.save_comments = 1
