; php-fpm pool overrides.
;
; The stock www pool ships clear_env = yes, which strips the process environment
; before PHP starts. That silently breaks this whole setup: compose supplies
; DB_HOST, REDIS_HOST, CACHE_STORE and friends as environment variables, and
; without them every container would fall back to the host's backend/.env and
; try to open its Windows SQLite path from inside Linux.

[www]
clear_env = no

; Worker error output is the only trace of a fatal in a request, and by default
; it goes to the FPM master's stderr unformatted and, for a bind mounted tree,
; attributed to the wrong file. This routes it through the pool log.
catch_workers_output = yes
decorate_workers_output = no

; One request per worker at a time, with enough workers to keep the API
; responsive while a PDF or Excel export occupies one. Raise on a bigger host;
; pm = dynamic rather than ondemand so a burst of API traffic does not pay PHP
; startup on every request.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; A worker that leaks memory is recycled after 500 requests. Long-lived enough
; to amortise the boot, short enough that a leak is a blip rather than an
; outage of the whole pool.
request_terminate_timeout = 300s
