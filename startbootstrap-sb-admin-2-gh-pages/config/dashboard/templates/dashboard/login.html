{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Login page for Django SB Admin 2">
    <meta name="author" content="">
    <title>Login</title>
    <link href="{% static 'dashboard/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,700,800,900" rel="stylesheet">
    <link href="{% static 'dashboard/css/sb-admin-2.min.css' %}" rel="stylesheet">
    <style>
        .login-illustration {
            min-height: 420px;
            background: #f8f9fc url("{% static 'dashboard/img/undraw_posting_photo.svg' %}") center center / 72% no-repeat;
        }

        @media (max-width: 767.98px) {
            .login-illustration {
                min-height: 220px;
                background-size: 55%;
            }
        }
    </style>
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-md-5 d-none d-md-block login-illustration"></div>
                            <div class="col-md-7 col-lg-7">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-2">Welcome Back!</h1>
                                        <p class="small text-gray-600 mb-4">Sign in with a Django user account to open the dashboard.</p>
                                    </div>

                                    {% if messages %}
                                        {% for message in messages %}
                                            <div class="alert alert-danger" role="alert">{{ message }}</div>
                                        {% endfor %}
                                    {% endif %}

                                    <form class="user" method="post">
                                        {% csrf_token %}
                                        <input type="hidden" name="next" value="{{ next }}">

                                        <div class="form-group">
                                            <input
                                                type="text"
                                                name="username"
                                                class="form-control form-control-user"
                                                placeholder="Username"
                                                required
                                                autofocus
                                            >
                                        </div>
                                        <div class="form-group">
                                            <input
                                                type="password"
                                                name="password"
                                                class="form-control form-control-user"
                                                placeholder="Password"
                                                required
                                            >
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Login
                                        </button>
                                    </form>

                                    <hr>
                                    <div class="text-center">
                                        <span class="small text-gray-600">Protected dashboard with Django sessions and SB Admin 2 UI.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'dashboard/vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'dashboard/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'dashboard/vendor/jquery-easing/jquery.easing.min.js' %}"></script>
    <script src="{% static 'dashboard/js/sb-admin-2.min.js' %}"></script>
</body>
</html>
