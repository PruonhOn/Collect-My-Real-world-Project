{% extends "downloader/base.html" %}
{% block title %}Login — K&N Downloader{% endblock %}
{% block content %}
<style>
.auth-wrap { min-height: calc(100vh - 80px); display:flex; align-items:center; justify-content:center; padding:2rem 1.5rem; }
.auth-footer { text-align:center; margin-top:1.5rem; color:var(--text-secondary); font-size:0.9rem; }
.auth-footer a { color:var(--neon-cyan); text-decoration:none; font-weight:600; }
.form-errors { background:rgba(255,0,110,0.08); border:1px solid rgba(255,0,110,0.3); border-radius:8px; padding:0.8rem 1rem; margin-bottom:1rem; color:var(--neon-pink); font-size:0.88rem; }
</style>
<div class="auth-wrap">
  <div class="card" style="width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:1.8rem">
      <div style="font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">K&amp;N</div>
      <div style="font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:900;margin-bottom:0.3rem">Sign In</div>
      <div style="color:var(--text-secondary);font-size:0.9rem">Welcome back</div>
    </div>
    {% if form.errors %}
    <div class="form-errors">Invalid username or password. Please try again.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Your username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Your password" required>
      </div>
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">Sign In</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="{% url 'register' %}">Sign Up Free</a></div>
  </div>
</div>
{% endblock %}
