services:
  - type: web
    name: kn-downloader
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn kn_downloader.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
